app = 'f1-race-tracking-app'
primary_region = 'cdg'

[build]

[env]
  POLL_SECONDS = "20"
  DB_PATH = "/data/f1.db"

[mounts]
  source = "f1data"
  destination = "/data"

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [[http_service.checks]]
    path = "/health"
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
